<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - AhmedStor</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <!-- مكتبة ExcelJS لتنسيق وتقسيم الإكسيل وعمل الإطارات للطباعة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background: #f1f5f9; color: #0f172a; padding: 20px 10px 60px 10px; }
    .container { max-width: 900px; margin: auto; }
    header { background: #0f172a; color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
    
    .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #cbd5e1; }
    .card h2 { font-size: 1.2rem; color: #0284c7; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: bold; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
    
    .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; background: #0284c7; width: 100%; font-size: 0.95rem; }
    .btn-green { background: #10b981; }
    .btn-danger { background: #ef4444; width: auto; padding: 4px 10px; font-size: 0.8rem; }
    
    .flex-row { display: flex; gap: 10px; }
    .flex-row input { flex: 1; }

    /* قائمة المنتجات والأقسام */
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #e2e8f0; }
    .list-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>لوحة تحكم AhmedStor</h1>
    </header>

    <!-- 1. إعدادات الشحن -->
    <div class="card">
      <h2>إعدادات الشحن 🚚</h2>
      <div class="form-group">
        <label>قيمة الشحن (اكتب 0 للشحن المجاني)</label>
        <div class="flex-row">
          <input type="number" id="shippingFeeInput" placeholder="مثال: 50">
          <button class="btn" style="width: 120px;" onclick="saveShippingFee()">حفظ الشحن</button>
        </div>
      </div>
    </div>

    <!-- 2. إرسال الطلبات إكسيل -->
    <div class="card">
      <h2>إدارة الطلبات والتقارير 📊</h2>
      <p style="font-size:0.85rem; color:#64748b; margin-bottom:12px;">تحميل فواتير اليوم مقسمة ومحاطة بالإطارات للطباعة باسم AhmedStor وإرسالها للواتساب.</p>
      <button class="btn btn-green" onclick="exportExcelInvoice()">إرسال فواتير اليوم إكسيل للواتساب 📊</button>
    </div>

    <!-- 3. إضافة وتعديل الأقسام -->
    <div class="card">
      <h2>إدارة الأقسام 🏷️</h2>
      <div class="form-group">
        <label>إضافة قسم جديد</label>
        <div class="flex-row">
          <input type="text" id="newCatInput" placeholder="اسم القسم الجديد">
          <button class="btn" style="width: 120px;" onclick="addCategory()">إضافة</button>
        </div>
      </div>
      <div id="categoriesList" style="margin-top: 15px;"></div>
    </div>

    <!-- 4. إضافة منتج جديد -->
    <div class="card">
      <h2>إضافة منتج جديد 📦</h2>
      <form id="addProductForm">
        <div class="form-group">
          <label>اسم المنتج</label>
          <input type="text" id="pTitle" required>
        </div>
        <div class="form-group">
          <label>القسم</label>
          <select id="pCategory" required></select>
        </div>
        <div class="form-group">
          <label>السعر (ج.م)</label>
          <input type="number" id="pPrice" required>
        </div>
        <div class="form-group">
          <label>صورة المنتج (تحميل من الهاتف 📱)</label>
          <input type="file" id="pImageFile" accept="image/*" required>
        </div>
        <div class="form-group">
          <label>الوصف (اختياري)</label>
          <textarea id="pDesc" rows="2"></textarea>
        </div>
        <button type="submit" class="btn" id="submitBtn">حفظ المنتج</button>
      </form>
    </div>

    <!-- 5. قائمة المنتجات الحالية -->
    <div class="card">
      <h2>المنتجات الحالية 📋</h2>
      <div id="productsList">جاري التحميل...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCpxlOYiDx1nHyvkQpRMrnFD83KeKQbpUk",
      authDomain: "guevara-stor.firebaseapp.com",
      databaseURL: "https://guevara-stor-default-rtdb.firebaseio.com",
      projectId: "guevara-stor",
      storageBucket: "guevara-stor.firebasestorage.app",
      messagingSenderId: "931509510252",
      appId: "1:931509510252:web:3b02b68c375d16aa863849"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const WHATSAPP_NUM = "201501008175";

    let categories = ["الكل", "منتجات حريمي", "منتجات رجالي", "أخرى"];
    let products = {};

    // 1. تحميل إعدادات الشحن
    onValue(ref(db, 'settings/shippingFee'), (snapshot) => {
      if (snapshot.exists()) {
        document.getElementById('shippingFeeInput').value = snapshot.val();
      } else {
        document.getElementById('shippingFeeInput').value = 0;
      }
    });

    window.saveShippingFee = function() {
      const fee = Number(document.getElementById('shippingFeeInput').value) || 0;
      set(ref(db, 'settings/shippingFee'), fee).then(() => {
        alert('تم حفظ قيمة الشحن بنجاح!');
      });
    };

    // 2. تحميل وإدارة الأقسام
    onValue(ref(db, 'categories'), (snapshot) => {
      if (snapshot.exists()) {
        categories = snapshot.val();
      } else {
        set(ref(db, 'categories'), categories);
      }
      renderCategories();
    });

    function renderCategories() {
      const select = document.getElementById('pCategory');
      const list = document.getElementById('categoriesList');
      select.innerHTML = '';
      list.innerHTML = '';

      categories.forEach((cat, index) => {
        if (cat !== 'الكل') {
          select.innerHTML += `<option value="${cat}">${cat}</option>`;
          list.innerHTML += `
            <div class="list-item">
              <span>${cat}</span>
              <button class="btn btn-danger" onclick="deleteCategory(${index})">حذف</button>
            </div>
          `;
        }
      });
    }

    window.addCategory = function() {
      const val = document.getElementById('newCatInput').value.trim();
      if (val && !categories.includes(val)) {
        categories.push(val);
        set(ref(db, 'categories'), categories);
        document.getElementById('newCatInput').value = '';
      }
    };

    window.deleteCategory = function(index) {
      if (confirm('هل أنت تأكد من حذف هذا القسم؟')) {
        categories.splice(index, 1);
        set(ref(db, 'categories'), categories);
      }
    };

    // 3. تحميل وإدارة المنتجات
    onValue(ref(db, 'products'), (snapshot) => {
      products = snapshot.val() || {};
      renderProducts();
    });

    function renderProducts() {
      const list = document.getElementById('productsList');
      list.innerHTML = '';

      const keys = Object.keys(products);
      if (keys.length === 0) {
        list.innerHTML = '<p style="color:#64748b;">لا توجد منتجات حالياً.</p>';
        return;
      }

      keys.forEach(key => {
        const p = products[key];
        list.innerHTML += `
          <div class="list-item">
            <div style="display:flex; align-items:center; gap:10px;">
              <img src="${p.image}" width="40" height="40" style="object-fit:cover; border-radius:4px;">
              <div>
                <strong>${p.title}</strong> - <span style="color:#0284c7;">${p.price} ج.م</span>
                <br><small style="color:#64748b;">القسم: ${p.category}</small>
              </div>
            </div>
            <button class="btn btn-danger" onclick="deleteProduct('${key}')">حذف</button>
          </div>
        `;
      });
    }

    // دالة تحويل ملف الصورة المحمل من الهاتف إلى Base64
    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fileInput = document.getElementById('pImageFile');
      if (!fileInput.files || fileInput.files.length === 0) {
        alert('يرجى اختيار صورة للمنتج من الهاتف!');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.innerText = 'جاري رفع الصورة والمنتج...';
      btn.disabled = true;

      try {
        const imageBase64 = await convertFileToBase64(fileInput.files[0]);

        const newProduct = {
          title: document.getElementById('pTitle').value,
          category: document.getElementById('pCategory').value,
          price: Number(document.getElementById('pPrice').value),
          image: imageBase64,
          description: document.getElementById('pDesc').value
        };

        await push(ref(db, 'products'), newProduct);
        alert('تمت إضافة المنتج بالصورة بنجاح!');
        document.getElementById('addProductForm').reset();
      } catch (err) {
        alert('حدث خطأ أثناء تحميل الصورة: ' + err.message);
      } finally {
        btn.innerText = 'حفظ المنتج';
        btn.disabled = false;
      }
    });

    window.deleteProduct = function(key) {
      if (confirm('هل أنت تأكد من حذف هذا المنتج؟')) {
        remove(ref(db, 'products/' + key));
      }
    };

    // 4. تصدير الفواتير منسقة وجاهزة للطباعة مع إطارات بواسطة ExcelJS
    window.exportExcelInvoice = async function() {
      const todayISO = new Date().toISOString().split('T')[0];
      const snapshot = await get(ref(db, 'orders'));
      const orders = snapshot.val() || {};

      const todayOrders = Object.values(orders).filter(o => o.dateStr === todayISO);

      if (todayOrders.length === 0) {
        alert('لا توجد طلبات مسجلة اليوم حتى الآن!');
        return;
      }

      const workbook = new ExcelJS.Workbook();
      const worksheet = workbook.addWorksheet('فواتير اليوم', {
        views: [{ rtl: true }] // اتجاه من اليمين لليسار
      });

      // تحديد أبعاد الأعمدة الأربعة للطباعة المنظمة
      worksheet.columns = [
        { width: 28 }, // A: اسم المنتج
        { width: 14 }, // B: السعر الفردي
        { width: 10 }, // C: الكمية
        { width: 16 }  // D: الإجمالي
      ];

      const thinBorder = {
        top: { style: 'thin' },
        left: { style: 'thin' },
        bottom: { style: 'thin' },
        right: { style: 'thin' }
      };

      todayOrders.forEach((o, index) => {
        // ترويسة الفاتورة
        const headerRow = worksheet.addRow([`AhmedStor - فاتورة رقم (${index + 1})`, '', '', '']);
        worksheet.mergeCells(`A${headerRow.number}:D${headerRow.number}`);
        headerRow.getCell(1).font = { bold: true, size: 13, color: { argb: 'FFFFFF' } };
        headerRow.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: '0F172A' } };
        headerRow.getCell(1).alignment = { horizontal: 'center', vertical: 'middle' };

        // بيانات العميل
        const r1 = worksheet.addRow(['اسم العميل:', o.name, 'رقم الهاتف:', o.phone]);
        const r2 = worksheet.addRow(['العنوان:', o.address, 'التاريخ:', o.dateFormatted || '']);
        worksheet.mergeCells(`B${r2.number}:D${r2.number}`);

        [r1, r2].forEach(row => {
          row.eachCell(cell => {
            cell.font = { size: 10 };
            cell.alignment = { vertical: 'middle' };
          });
        });

        // رأس جدول المنتجات
        const tableHeader = worksheet.addRow(['اسم المنتج', 'السعر الفردي', 'الكمية', 'الإجمالي الفرعي']);
        tableHeader.eachCell(cell => {
          cell.font = { bold: true, color: { argb: 'FFFFFF' } };
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: '0284C7' } };
          cell.alignment = { horizontal: 'center', vertical: 'middle' };
        });

        const startRow = headerRow.number;

        // صفوف المنتجات
        o.cart.forEach(item => {
          const itemRow = worksheet.addRow([item.title, `${item.price} ج.م`, item.qty, `${item.price * item.qty} ج.م`]);
          itemRow.eachCell((cell, colNum) => {
            cell.alignment = { horizontal: colNum === 1 ? 'right' : 'center', vertical: 'middle' };
          });
        });

        // صفوف المبالغ والإجمالي
        const subtotalRow = worksheet.addRow(['مبلغ المنتجات:', '', '', `${o.total} ج.م`]);
        worksheet.mergeCells(`A${subtotalRow.number}:C${subtotalRow.number}`);

        const shippingRow = worksheet.addRow(['قيمة الشحن:', '', '', `${o.shippingFee || 0} ج.م`]);
        worksheet.mergeCells(`A${shippingRow.number}:C${shippingRow.number}`);

        const grandTotalRow = worksheet.addRow(['الإجمالي الكلي النهائي:', '', '', `${(o.total + (o.shippingFee || 0))} ج.م`]);
        worksheet.mergeCells(`A${grandTotalRow.number}:C${grandTotalRow.number}`);

        [subtotalRow, shippingRow, grandTotalRow].forEach(row => {
          row.getCell(1).font = { bold: true };
          row.getCell(4).font = { bold: true };
          row.getCell(1).alignment = { horizontal: 'left' };
          row.getCell(4).alignment = { horizontal: 'center' };
        });

        const endRow = grandTotalRow.number;

        // وضع الإطار والحدود الكاملة حول الفاتورة الحالية
        for (let r = startRow; r <= endRow; r++) {
          for (let c = 1; c <= 4; c++) {
            worksheet.getCell(r, c).border = thinBorder;
          }
        }

        // مسافة بين الفواتير
        worksheet.addRow([]);
        worksheet.addRow([]);
      });

      // حفظ الملف ومشاركته
      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Invoices_AhmedStor_${todayISO}.xlsx`;
      a.click();
      window.URL.revokeObjectURL(url);

      const msg = `*فواتير يوم (${todayISO}) - AhmedStor* 📄\n\n- عدد الفواتير: ${todayOrders.length}\n- تم تنزيل الملف المنسق والمحاط بالإطارات للطباعة مباشرة.`;
      window.open(`https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
    };
  </script>
</body>
                                                                     </html>
