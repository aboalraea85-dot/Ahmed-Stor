<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم - AhmedStor</title>
  <!-- مكتبة إنشاء ملفات الإكسيل XLSX -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f1f5f9; }
    .admin-card { background: white; padding: 20px; border-radius: 10px; max-width: 800px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .btn-excel { background: #10b981; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 15px; width: 100%; }
    .btn-excel:hover { background: #059669; }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2>إدارة طلبات اليوم 📊</h2>
    <p>يمكنك تحميل طلبات اليوم وإرسالها إكسيل إلى رقم الواتساب المسجل (01501008175).</p>
    
    <button class="btn-excel" onclick="sendTodayOrdersToWhatsApp()">إرسال طلبات اليوم ملف إكسيل للواتساب 📊</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCpxlOYiDx1nHyvkQpRMrnFD83KeKQbpUk",
      authDomain: "guevara-stor.firebaseapp.com",
      databaseURL: "https://guevara-stor-default-rtdb.firebaseio.com",
      projectId: "guevara-stor",
      storageBucket: "guevara-stor.firebasestorage.app",
      messagingSenderId: "931509510252",
      appId: "1:931509510252:web:3b02b68c375d16aa863849"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const MY_WHATSAPP_NUMBER = "201501008175"; // رقم الواتساب المخصص لاستلام الإكسيل

    window.sendTodayOrdersToWhatsApp = async function() {
      const todayISO = new Date().toISOString().split('T')[0];
      const snapshot = await get(ref(db, 'orders'));
      const orders = snapshot.val() || {};

      const todayOrders = Object.values(orders).filter(o => o.dateStr === todayISO);

      if (todayOrders.length === 0) {
        alert('لا توجد طلبات مسجلة بتاريخ اليوم حتى الآن!');
        return;
      }

      // تحضير البيانات لملف الإكسيل
      const excelData = [];
      todayOrders.forEach((o, index) => {
        const itemsStr = o.cart.map(c => `${c.title} (${c.qty})`).join(' - ');
        excelData.push({
          "م": index + 1,
          "التاريخ والوقت": o.dateFormatted || '',
          "اسم العميل": o.name,
          "رقم الهاتف": o.phone,
          "العنوان": o.address,
          "المنتجات والكميات": itemsStr,
          "الإجمالي (ج.م)": o.total
        });
      });

      // إنشاء ملف الإكسيل وتحميله تلقائياً
      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "طلبات_اليوم");
      const fileName = `طلبات_يوم_${todayISO}.xlsx`;
      XLSX.writeFile(workbook, fileName);

      // فتح محادثة الواتساب جاهزة بالرسالة ورابط التحميل
      const msg = `*تقرير طلبات اليوم (${todayISO})* 📊\n\n- عدد الطلبات: ${todayOrders.length}\n- تم تحميل ملف الإكسيل تلقائياً باسم: ${fileName}\n\nيرجى إرفاق الملف المحمل هنا للحفظ.`;
      
      window.open(`https://wa.me/${MY_WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    };
  </script>
</body>
</html>
