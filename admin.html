<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة المتجر - AhmedStor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة تصدير ملفات الإكسيل XLSX -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div class="max-w-6xl mx-auto">
        <!-- الهيدر الرئيسي -->
        <div class="bg-slate-900 text-white rounded-xl p-6 mb-6 shadow-md flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-2xl font-extrabold flex items-center gap-2">
                <i class="fa-solid fa-gear text-indigo-400"></i> لوحة إدارة المتجر - AhmedStor
            </h1>
            <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg transition flex items-center gap-2 text-sm shadow">
                <i class="fa-solid fa-file-excel"></i> تصدير الطلبات المحدثة لإكسيل
            </button>
        </div>

        <!-- أزرار التبديل بين الأقسام (Tabs) -->
        <div class="flex border-b border-gray-300 mb-6 bg-white rounded-t-xl overflow-hidden shadow-sm">
            <button id="btn-tab-orders" onclick="switchTab('orders')" class="px-6 py-3 font-bold text-sm border-b-2 border-indigo-600 text-indigo-600 bg-indigo-50/50 flex items-center gap-2">
                <i class="fa-solid fa-list-check"></i> الطلبات
            </button>
            <button id="btn-tab-products" onclick="switchTab('products')" class="px-6 py-3 font-bold text-sm text-gray-600 border-b-2 border-transparent hover:text-indigo-600 flex items-center gap-2">
                <i class="fa-solid fa-box"></i> إدارة المنتجات
            </button>
            <button id="btn-tab-categories" onclick="switchTab('categories')" class="px-6 py-3 font-bold text-sm text-gray-600 border-b-2 border-transparent hover:text-indigo-600 flex items-center gap-2">
                <i class="fa-solid fa-folder"></i> إدارة الأقسام
            </button>
        </div>

        <!-- 1. تبويب الطلبات -->
        <div id="tab-orders" class="tab-content">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border text-center">
                    <p class="text-gray-500 font-semibold text-sm mb-1">إجمالي عدد الطلبات</p>
                    <h3 id="totalOrdersCount" class="text-3xl font-black text-indigo-600">0</h3>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border text-center">
                    <p class="text-gray-500 font-semibold text-sm mb-1">إجمالي المبيعات (شامل الشحن)</p>
                    <h3 id="totalSalesAmount" class="text-3xl font-black text-emerald-600">0 ج.م</h3>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <div class="p-4 bg-gray-50 border-b flex justify-between items-center flex-wrap gap-2">
                    <h3 class="font-bold text-gray-700">قائمة الطلبات الحالية</h3>
                    <button onclick="printSelectedInvoices()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition flex items-center gap-2 shadow">
                        <i class="fa-solid fa-print"></i> طباعة الفواتير المحددة
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-slate-50 border-b text-gray-600">
                            <tr>
                                <th class="p-3"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                                <th class="p-3">اسم العميل</th>
                                <th class="p-3">الهاتف</th>
                                <th class="p-3">العنوان</th>
                                <th class="p-3">تفاصيل المنتجات</th>
                                <th class="p-3">الشحن</th>
                                <th class="p-3">الإجمالي الكلي</th>
                                <th class="p-3">التاريخ</th>
                                <th class="p-3">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <tr>
                                <td colspan="9" class="text-center py-6 text-gray-500">جاري تحميل البيانات...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 2. تبويب إدارة المنتجات -->
        <div id="tab-products" class="tab-content hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border mb-6">
                <h3 class="font-bold text-gray-800 mb-4">إضافة منتج جديد</h3>
                <form id="addProductForm" onsubmit="handleAddProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="prodTitle" placeholder="اسم المنتج" required class="border p-2 rounded-lg text-sm">
                    <input type="number" id="prodPrice" placeholder="السعر (ج.م)" required class="border p-2 rounded-lg text-sm">
                    <input type="number" id="prodShipping" placeholder="مصاريف الشحن (ج.م)" value="0" class="border p-2 rounded-lg text-sm">
                    <select id="prodCategory" required class="border p-2 rounded-lg text-sm bg-white">
                        <!-- يتم التحميل من الفايربيس -->
                    </select>
                    
                    <!-- خيار الصورة (ملف أو رابط) -->
                    <div class="md:col-span-2 border p-3 rounded-lg bg-gray-50 space-y-2">
                        <div class="flex items-center gap-4 text-xs font-bold text-gray-700">
                            <span>مصدر الصورة:</span>
                            <label class="cursor-pointer flex items-center gap-1">
                                <input type="radio" name="imageSource" value="file" checked onclick="toggleImageInput('file')"> رفع من الجهاز
                            </label>
                            <label class="cursor-pointer flex items-center gap-1">
                                <input type="radio" name="imageSource" value="url" onclick="toggleImageInput('url')"> رابط صورة (URL)
                            </label>
                        </div>
                        <input type="file" id="prodImageFile" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                        <input type="url" id="prodImageUrl" placeholder="ضع رابط الصورة هنا (https://...)" class="w-full border p-2 rounded-lg text-sm hidden">
                    </div>

                    <textarea id="prodDesc" placeholder="وصف المنتج" class="border p-2 rounded-lg text-sm md:col-span-2" rows="2"></textarea>
                    <button type="submit" id="submitProdBtn" class="bg-indigo-600 text-white font-bold py-2 rounded-lg md:col-span-2 hover:bg-indigo-700 transition">إضافة المنتج</button>
                </form>
            </div>
            <div id="adminProductsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </div>

        <!-- 3. تبويب إدارة الأقسام -->
        <div id="tab-categories" class="tab-content hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border max-w-md">
                <h3 class="font-bold text-gray-800 mb-4">إضافة قسم جديد</h3>
                <form onsubmit="handleAddCategory(event)" class="flex gap-2">
                    <input type="text" id="catName" placeholder="اسم القسم" required class="border p-2 rounded-lg text-sm flex-grow">
                    <button type="submit" class="bg-indigo-600 text-white font-bold px-4 py-2 rounded-lg hover:bg-indigo-700 transition text-sm">إضافة</button>
                </form>
                <ul id="adminCategoriesList" class="mt-4 divide-y"></ul>
            </div>
        </div>
    </div>

    <!-- منطقة خفية للطباعة -->
    <div id="printArea" class="hidden p-8 bg-white"></div>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let rawOrdersData = {};
        let activeImageMode = 'file';

        // --- دالة التبديل المضبوطة بين التبويبات ---
        function switchTab(tabName) {
            // 1. إخفاء كافة المحتويات
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.add('hidden'));

            // 2. إلغاء تفعيل كافة الأزرار
            const btns = ['orders', 'products', 'categories'];
            btns.forEach(b => {
                const btnEl = document.getElementById(`btn-tab-${b}`);
                if (btnEl) {
                    btnEl.className = "px-6 py-3 font-bold text-sm text-gray-600 border-b-2 border-transparent hover:text-indigo-600 flex items-center gap-2";
                }
            });

            // 3. إظهار التبويب المطلوب وتفعيل زره
            const targetTab = document.getElementById(`tab-${tabName}`);
            const targetBtn = document.getElementById(`btn-tab-${tabName}`);

            if (targetTab) targetTab.classList.remove('hidden');
            if (targetBtn) {
                targetBtn.className = "px-6 py-3 font-bold text-sm border-b-2 border-indigo-600 text-indigo-600 bg-indigo-50/50 flex items-center gap-2";
            }
        }

        function toggleImageInput(mode) {
            activeImageMode = mode;
            const fileInput = document.getElementById('prodImageFile');
            const urlInput = document.getElementById('prodImageUrl');
            if (mode === 'file') {
                fileInput.classList.remove('hidden');
                urlInput.classList.add('hidden');
            } else {
                fileInput.classList.add('hidden');
                urlInput.classList.remove('hidden');
            }
        }

        // --- تحميل البيانات عند فتح الصفحة ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchOrders();
            fetchCategories();
            fetchProducts();
        });

        // جلب الطلبات
        function fetchOrders() {
            db.ref('orders').on('value', (snapshot) => {
                const tbody = document.getElementById('ordersTableBody');
                tbody.innerHTML = '';
                rawOrdersData = snapshot.val() || {};

                if (!snapshot.exists()) {
                    tbody.innerHTML = '<tr><td colspan="9" class="text-center py-6 text-gray-500">لا توجد طلبات مسجلة.</td></tr>';
                    document.getElementById('totalOrdersCount').innerText = '0';
                    document.getElementById('totalSalesAmount').innerText = '0 ج.م';
                    return;
                }

                let count = 0;
                let totalSales = 0;

                snapshot.forEach((child) => {
                    const order = child.val();
                    const key = child.key;
                    count++;
                    
                    const shippingFee = Number(order.shippingFee || 0);
                    const grandTotal = Number(order.totalAmount || 0) + shippingFee;
                    totalSales += grandTotal;

                    const itemsSummary = order.items ? order.items.map(i => `${i.title} (${i.qty})`).join(', ') : '';
                    const dateStr = order.createdAt ? new Date(order.createdAt).toLocaleDateString('ar-EG') : '-';

                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-3"><input type="checkbox" class="order-checkbox" value="${key}"></td>
                            <td class="p-3 font-semibold">${order.customer?.name || '-'}</td>
                            <td class="p-3">${order.customer?.phone || '-'}</td>
                            <td class="p-3">${order.customer?.address || '-'}</td>
                            <td class="p-3 text-xs text-gray-600 max-w-xs">${itemsSummary}</td>
                            <td class="p-3 text-gray-600">${shippingFee} ج.م</td>
                            <td class="p-3 font-bold text-indigo-600">${grandTotal} ج.م</td>
                            <td class="p-3 text-xs text-gray-500">${dateStr}</td>
                            <td class="p-3">
                                <button onclick="deleteOrder('${key}')" class="text-red-500 hover:text-red-700 font-bold text-xs"><i class="fa-solid fa-trash"></i> حذف</button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('totalOrdersCount').innerText = count;
                document.getElementById('totalSalesAmount').innerText = totalSales.toLocaleString() + ' ج.م';
            });
        }

        function toggleSelectAll(master) {
            document.querySelectorAll('.order-checkbox').forEach(cb => cb.checked = master.checked);
        }

        // تصدير الإكسيل
        function exportToExcel() {
            if (Object.keys(rawOrdersData).length === 0) {
                alert('لا توجد بيانات طلبات لتصديرها!');
                return;
            }

            const exportData = [];
            Object.keys(rawOrdersData).forEach(key => {
                const order = rawOrdersData[key];
                const itemsStr = order.items ? order.items.map(i => `${i.title} [الكمية: ${i.qty}]`).join(' | ') : '';
                const shipping = Number(order.shippingFee || 0);
                const total = Number(order.totalAmount || 0);

                exportData.push({
                    "رقم الطلب": key,
                    "اسم العميل": order.customer?.name || '',
                    "رقم الهاتف": order.customer?.phone || '',
                    "العنوان": order.customer?.address || '',
                    "المنتجات": itemsStr,
                    "قيمة المنتجات (ج.م)": total,
                    "الشحن (ج.م)": shipping,
                    "الإجمالي الكلي (ج.م)": total + shipping,
                    "التاريخ": order.createdAt ? new Date(order.createdAt).toLocaleString('ar-EG') : ''
                });
            });

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "الطلبات");

            const dateNow = new Date().toISOString().slice(0, 10);
            XLSX.writeFile(workbook, `AhmedStor_Orders_${dateNow}.xlsx`);
        }

        // طباعة الفواتير
        function printSelectedInvoices() {
            const selectedBoxes = document.querySelectorAll('.order-checkbox:checked');
            if (selectedBoxes.length === 0) {
                alert('يرجى تحديد طلب واحد على الأقل للطباعة!');
                return;
            }

            const printArea = document.getElementById('printArea');
            printArea.innerHTML = '<h2 style="text-align:center; font-size:24px; font-weight:bold; margin-bottom:20px;">فواتير الشراء - AhmedStor</h2>';

            selectedBoxes.forEach(box => {
                const order = rawOrdersData[box.value];
                if (!order) return;

                let itemsHtml = '';
                if(order.items) {
                    order.items.forEach(i => {
                        itemsHtml += `<li style="display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding:4px 0;"><span>${i.title} × ${i.qty}</span> <span>${i.price * i.qty} ج.م</span></li>`;
                    });
                }

                const shipping = Number(order.shippingFee || 0);
                const subtotal = Number(order.totalAmount || 0);

                printArea.innerHTML += `
                    <div style="border:2px solid #333; border-radius:8px; padding:15px; margin-bottom:20px; page-break-after: always;">
                        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #ccc; padding-bottom:8px; margin-bottom:10px;">
                            <strong>طلب رقم: ${box.value.substring(0, 8)}</strong>
                            <span>التاريخ: ${order.createdAt ? new Date(order.createdAt).toLocaleDateString('ar-EG') : ''}</span>
                        </div>
                        <p><strong>اسم العميل:</strong> ${order.customer?.name || '-'}</p>
                        <p><strong>الهاتف:</strong> ${order.customer?.phone || '-'}</p>
                        <p><strong>العنوان:</strong> ${order.customer?.address || '-'}</p>
                        <h4 style="margin-top:10px; font-weight:bold;">المنتجات:</h4>
                        <ul style="list-style:none; padding:0;">${itemsHtml}</ul>
                        <hr style="margin:10px 0;">
                        <p style="display:flex; justify-content:space-between; margin:2px 0;"><span>إجمالي المنتجات:</span> <span>${subtotal} ج.م</span></p>
                        <p style="display:flex; justify-content:space-between; margin:2px 0;"><span>مصاريف الشحن:</span> <span>${shipping} ج.م</span></p>
                        <p style="text-align:left; font-size:18px; font-weight:bold; margin-top:10px; border-top:2px dashed #333; padding-top:5px;">الإجمالي الكلي: ${subtotal + shipping} ج.م</p>
                    </div>
                `;
            });

            printArea.classList.remove('hidden');
            window.print();
            printArea.classList.add('hidden');
        }

        // إضافة المنتج
        function handleAddProduct(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitProdBtn');

            const title = document.getElementById('prodTitle').value;
            const price = Number(document.getElementById('prodPrice').value);
            const shippingFee = Number(document.getElementById('prodShipping').value || 0);
            const category = document.getElementById('prodCategory').value;
            const description = document.getElementById('prodDesc').value;

            const saveToDb = (imageUrl) => {
                db.ref('products').push({
                    title, price, shippingFee, category, description,
                    image: imageUrl
                }).then(() => {
                    e.target.reset();
