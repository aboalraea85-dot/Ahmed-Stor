<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - AhmedStor</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- مكتبة XLSX لتصدير ملفات الإكسيل -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #0284c7;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; }

    header {
      background: var(--primary);
      color: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 { font-size: 1.2rem; }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-success { background: var(--success); color: white; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-danger { background: var(--danger); color: white; }

    .stats-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      text-align: center;
    }
    .stat-card h3 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .stat-card .val { font-size: 1.4rem; font-weight: 700; color: var(--accent); }

    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow-x: auto;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
      font-size: 0.85rem;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      background: #f1f5f9;
      color: var(--primary);
      font-weight: 700;
    }
    tr:hover { background: #f8fafc; }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #e2e8f0;
      color: var(--text);
    }
  </style>
</head>
<body>

  <header>
    <h1>📋 لوحة إدارة الطلبات - AhmedStor</h1>
    <button class="btn btn-success" onclick="exportOrdersToExcel()">📥 تصدير كافه الطلبات لإكسيل</button>
  </header>

  <div class="stats-cards">
    <div class="stat-card">
      <h3>إجمالي عدد الطلبات</h3>
      <div class="val" id="totalOrdersCount">0</div>
    </div>
    <div class="stat-card">
      <h3>إجمالي المبيعات</h3>
      <div class="val" id="totalSalesAmount">0 ج.م</div>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>اسم العميل</th>
          <th>الهاتف</th>
          <th>العنوان</th>
          <th>تفاصيل المنتجات</th>
          <th>إجمالي المنتجات</th>
          <th>الشحن</th>
          <th>الإجمالي الكلي</th>
          <th>الإجراءات</th>
        </tr>
      </thead>
      <tbody id="ordersTableBody">
        <tr>
          <td colspan="9" style="text-align:center; padding: 20px; color: var(--text-muted);">جاري تحميل الطلبات...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCpxlOYiDx1nHyvkQpRMrnFD83KeKQbpUk",
      authDomain: "guevara-stor.firebaseapp.com",
      databaseURL: "https://guevara-stor-default-rtdb.firebaseio.com",
      projectId: "guevara-stor",
      storageBucket: "guevara-stor.firebasestorage.app",
      messagingSenderId: "931509510252",
      appId: "1:931509510252:web:3b02b68c375d16aa863849"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let ordersData = {};

    // الاستماع للطلبات لحظياً من قاعدة البيانات
    onValue(ref(db, 'orders'), (snapshot) => {
      ordersData = snapshot.val() || {};
      renderOrders();
    });

    function renderOrders() {
      const tbody = document.getElementById('ordersTableBody');
      const keys = Object.keys(ordersData);

      document.getElementById('totalOrdersCount').innerText = keys.length;

      if (keys.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding: 20px; color: var(--text-muted);">لا توجد أي طلبات حالياً.</td></tr>';
        document.getElementById('totalSalesAmount').innerText = '0 ج.م';
        return;
      }

      let totalSales = 0;
      tbody.innerHTML = '';

      // عرض أحدث الطلبات في الأعلى
      keys.reverse().forEach(key => {
        const order = ordersData[key];
        const subtotal = Number(order.subtotal) || 0;
        const shippingFee = Number(order.shippingFee) || 0;
        const grandTotal = Number(order.total) || (subtotal + shippingFee);

        totalSales += grandTotal;

        const cartText = order.cart 
          ? order.cart.map(i => `${i.title} (${i.qty})`).join('<br>') 
          : 'لا توجد تفاصيل';

        tbody.innerHTML += `
          <tr>
            <td>${order.dateFormatted || order.dateStr || '-'}</td>
            <td><strong>${order.name || '-'}</strong></td>
            <td><a href="tel:${order.phone}" style="color:var(--accent); text-decoration:none;">${order.phone || '-'}</a></td>
            <td>${order.address || '-'}</td>
            <td>${cartText}</td>
            <td>${subtotal} ج.م</td>
            <td>${shippingFee} ج.م</td>
            <td><strong>${grandTotal} ج.م</strong></td>
            <td>
              <button class="btn btn-danger" style="padding:4px 8px; font-size:0.75rem;" onclick="deleteOrder('${key}')">حذف 🗑️</button>
            </td>
          </tr>
        `;
      });

      document.getElementById('totalSalesAmount').innerText = `${totalSales} ج.م`;
    }

    // تصدير كل الطلبات المتاحة إلى ملف Excel
    window.exportOrdersToExcel = function() {
      const keys = Object.keys(ordersData);
      if (keys.length === 0) {
        alert("لا توجد طلبات لتصديرها حالياً!");
        return;
      }

      const exportRows = [];

      keys.forEach(key => {
        const order = ordersData[key];
        const subtotal = Number(order.subtotal) || 0;
        const shippingFee = Number(order.shippingFee) || 0;
        const grandTotal = Number(order.total) || (subtotal + shippingFee);

        const itemsDetail = order.cart 
          ? order.cart.map(item => `${item.title} (الكمية: ${item.qty})`).join(' | ')
          : 'لا توجد تفاصيل';

        exportRows.push({
          "رقم الطلب": key,
          "تاريخ الطلب": order.dateFormatted || order.dateStr || 'غير محدد',
          "اسم العميل": order.name || '',
          "رقم الهاتف": order.phone || '',
          "العنوان": order.address || '',
          "تفاصيل المنتجات": itemsDetail,
          "إجمالي المنتجات (ج.م)": subtotal,
          "مصاريف الشحن (ج.م)": shippingFee,
          "الإجمالي الكلي (ج.م)": grandTotal
        });
      });

      const worksheet = XLSX.utils.json_to_sheet(exportRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "الطلبات");

      const fileName = `طلبات_المتجر_${new Date().toISOString().split('T')[0]}.xlsx`;
      XLSX.writeFile(workbook, fileName);
    };

    // حذف طلب من اللوحة والقاعدة
    window.deleteOrder = async function(key) {
      if (confirm('هل أنت تأكد من رغبتك في حذف هذا الطلب؟')) {
        try {
          await remove(ref(db, `orders/${key}`));
          alert('تم حذف الطلب بنجاح.');
        } catch (err) {
          alert('حدث خطأ أثناء الحذف: ' + err.message);
        }
      }
    };
  </script>
</body>
</html>
