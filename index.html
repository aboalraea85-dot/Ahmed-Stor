<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AhmedStor - المتجر الرئيسي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0f3ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between antialiased">

    <!-- Header / Navbar -->
    <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center shadow-lg shadow-brand-600/30">
                    <i class="fa-solid fa-store text-white text-lg"></i>
                </div>
                <span class="font-black text-xl text-white tracking-wide">AhmedStor</span>
            </div>
            <div class="flex items-center gap-3">
                <a href="admin.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 border border-slate-700">
                    <i class="fa-solid fa-gauge-high"></i> لوحة التحكم
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto px-4 py-10 w-full">
        <div class="text-center space-y-4 mb-12">
            <h1 class="text-4xl font-black text-white">أهلاً بك في متجر AhmedStor</h1>
            <p class="text-slate-400 text-sm max-w-xl mx-auto">تسوق أحدث المنتجات والعروض المميزة بأفضل الأسعار وبشكل مباشر وسريع.</p>
        </div>

        <!-- Products Grid Container -->
        <div id="storeProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- سيتم عرض المنتجات المضافة من لوحة التحكم هنا تلقائياً -->
            <div class="col-span-full text-center py-16 text-slate-500 bg-slate-800/40 rounded-2xl border border-slate-800">
                <i class="fa-solid fa-box-open text-4xl mb-3 text-slate-600"></i>
                <p class="text-sm font-bold">جاري تحميل المنتجات أو لم يتم اضافة منتجات بعد...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>جميع الحقوق محفوظة © 2026 AhmedStor Pro</p>
    </footer>

</body>
</html>
