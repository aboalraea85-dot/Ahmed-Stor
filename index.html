<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AhmedStor - المتجر الإلكتروني</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- الهيدر / الشريط العلوي -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold tracking-wide">AhmedStor</h1>
            
            <!-- زر السلة -->
            <button id="cartBtn" onclick="toggleCartModal()" class="relative bg-indigo-700 hover:bg-indigo-800 text-white px-4 py-2 rounded-lg transition flex items-center gap-2">
                <i class="fa-solid font-bold fa-cart-shopping"></i>
                <span>السلة</span>
                <span id="cartCount" class="bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </header>

    <!-- الأقسام الرئيسية -->
    <section class="container mx-auto px-4 py-6">
        <h2 class="text-xl font-bold mb-4 border-r-4 border-indigo-600 pr-3">الأقسام</h2>
        <div id="categoriesList" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="filterCategory('all')" class="category-btn active-cat bg-indigo-600 text-white px-4 py-2 rounded-full whitespace-nowrap text-sm font-semibold transition">الكل</button>
            <!-- سيتم تحميل باقي الأقسام من Firebase -->
        </div>
    </section>

    <!-- عرض المنتجات -->
    <main class="container mx-auto px-4 py-4 flex-grow">
        <h2 class="text-xl font-bold mb-4 border-r-4 border-indigo-600 pr-3">المنتجات</h2>
        <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- سيتم تحميل المنتجات هنا -->
            <p class="col-span-full text-center text-gray-500 py-8">جاري تحميل المنتجات...</p>
        </div>
    </main>

    <!-- Modal سلة التسوق وإتمام الطلب -->
    <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <!-- رأس النافذة -->
            <div class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center">
                <h3 class="text-lg font-bold"><i class="fa-solid fa-cart-shopping ml-2"></i>سلة الشراء</h3>
                <button onclick="toggleCartModal()" class="text-white hover:text-gray-200 text-xl font-bold">&times;</button>
            </div>

            <!-- قائمة عناصر السلة -->
            <div id="cartItems" class="p-4 overflow-y-auto flex-grow divide-y">
                <!-- المنتجات بالسلة -->
            </div>

            <!-- تفاصيل الطلب والحساب الإجمالي -->
            <div class="p-4 bg-gray-50 border-t">
                <div class="flex justify-between items-center mb-4 font-bold text-lg">
                    <span>الإجمالي:</span>
                    <span id="cartTotal" class="text-indigo-600">0 ج.م</span>
                </div>

                <!-- نموذج بيانات العميل -->
                <form id="orderForm" onsubmit="handleCheckout(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">الاسم بالكامل</label>
                        <input type="text" id="custName" required class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="أدخل اسمك الكامل">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">رقم الهاتف</label>
                        <input type="tel" id="custPhone" required class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="01xxxxxxxxx">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">العنوان التفصيلي</label>
                        <textarea id="custAddress" required rows="2" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="المحافظة، المدينة، الشارع..."></textarea>
                    </div>

                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition flex items-center justify-center gap-2 mt-2">
                        <i class="fa-brands fa-whatsapp text-xl"></i>
                        <span>تأكيد الطلب عبر واتساب</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="bg-gray-800 text-white text-center py-4 mt-8 text-sm">
        <p>جميع الحقوق محفوظة &copy; 2026 - AhmedStor</p>
    </footer>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // --- 1. إعدادات Firebase ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // تهيئة Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- 2. متغيرات الحالة العامة ---
        let allProducts = [];
        let cart = JSON.parse(localStorage.getItem('ahmedstor_cart')) || [];
        let currentCategory = 'all';

        // --- 3. تحميل البيانات عند البدء ---
        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            loadProducts();
            updateCartUI();
        });

        // تحميل الأقسام
        function loadCategories() {
            db.ref('categories').on('value', (snapshot) => {
                const categoriesList = document.getElementById('categoriesList');
                categoriesList.innerHTML = `<button onclick="filterCategory('all')" class="category-btn ${currentCategory === 'all' ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'} px-4 py-2 rounded-full whitespace-nowrap text-sm font-semibold transition">الكل</button>`;
                
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const cat = child.val();
                        const isSelected = currentCategory === cat.name;
                        categoriesList.innerHTML += `
                            <button onclick="filterCategory('${cat.name}')" class="category-btn ${isSelected ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'} px-4 py-2 rounded-full whitespace-nowrap text-sm font-semibold transition">
                                ${cat.name}
                            </button>
                        `;
                    });
                }
            });
        }

        // تحميل المنتجات
        function loadProducts() {
            db.ref('products').on('value', (snapshot) => {
                allProducts = [];
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        allProducts.push({ id: child.key, ...child.val() });
                    });
                }
                renderProducts();
            });
        }

        // تصفية المنتجات حسب القسم
        function filterCategory(catName) {
            currentCategory = catName;
            loadCategories();
            renderProducts();
        }

        // عرض المنتجات في الواجهة
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            const filtered = currentCategory === 'all' 
                ? allProducts 
                : allProducts.filter(p => p.category === currentCategory);

            if (filtered.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-8">لا توجد منتجات متوفرة حالياً.</p>';
                return;
            }

            filtered.forEach(p => {
                const cartItem = cart.find(item => item.id === p.id);
                const qtyInCart = cartItem ? cartItem.qty : 0;

                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <img src="${p.image || 'https://via.placeholder.com/300'}" alt="${p.title}" class="w-full h-40 object-cover">
                            <div class="p-3">
                                <h3 class="font-bold text-gray-800 text-sm mb-1 line-clamp-1">${p.title}</h3>
                                <p class="text-xs text-gray-500 mb-2 line-clamp-2">${p.description || ''}</p>
                                <span class="text-indigo-600 font-extrabold text-base">${p.price} ج.م</span>
                            </div>
                        </div>
                        <div class="p-3 pt-0">
                            ${qtyInCart > 0 ? `
                                <div class="flex items-center justify-between bg-indigo-50 border border-indigo-200 rounded-lg p-1">
                                    <button onclick="changeQty('${p.id}', -1)" class="w-8 h-8 bg-indigo-600 text-white rounded font-bold hover:bg-indigo-700 transition">-</button>
                                    <span class="font-bold text-indigo-900">${qtyInCart}</span>
                                    <button onclick="changeQty('${p.id}', 1)" class="w-8 h-8 bg-indigo-600 text-white rounded font-bold hover:bg-indigo-700 transition">+</button>
                                </div>
                            ` : `
                                <button onclick="addToCart('${p.id}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg text-sm transition flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-plus text-xs"></i> إضافة للسلة
                                </button>
                            `}
                        </div>
                    </div>
                `;
            });
        }

        // --- 4. إدارة سلة التسوق ---
        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;

            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({
                    id: product.id,
                    title: product.title,
                    price: Number(product.price),
                    image: product.image,
                    qty: 1
                });
            }
            saveCart();
        }

        function changeQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;

            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== productId);
            }
            saveCart();
        }

        function saveCart() {
            localStorage.setItem('ahmedstor_cart', JSON.stringify(cart));
            updateCartUI();
            renderProducts();
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');

            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            cartCount.innerText = totalQty;
            cartTotal.innerText = totalPrice.toLocaleString() + ' ج.م';

            if (cart.length === 0) {
                cartItems.innerHTML = '<p class="text-center text-gray-500 py-6">السلة فارغة حالياً.</p>';
                return;
            }

            cartItems.innerHTML = '';
            cart.forEach(item => {
                cartItems.innerHTML += `
                    <div class="py-3 flex items-center justify-between gap-2">
                        <div class="flex items-center gap-3">
                            <img src="${item.image || 'https://via.placeholder.com/100'}" class="w-12 h-12 rounded object-cover">
                            <div>
                                <h4 class="font-bold text-sm text-gray-800">${item.title}</h4>
                                <p class="text-xs text-indigo-600 font-semibold">${item.price} × ${item.qty} = ${item.price * item.qty} ج.م</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty('${item.id}', -1)" class="w-7 h-7 bg-gray-200 hover:bg-gray-300 rounded font-bold text-sm">-</button>
                            <span class="font-bold text-sm">${item.qty}</span>
                            <button onclick="changeQty('${item.id}', 1)" class="w-7 h-7 bg-gray-200 hover:bg-gray-300 rounded font-bold text-sm">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleCartModal() {
            document.getElementById('cartModal').classList.toggle('hidden');
        }

        // --- 5. إتمام الطلب وتصديره إلى Firebase و WhatsApp ---
        function handleCheckout(e) {
            e.preventDefault();

            if (cart.length === 0) {
                alert('سلتك فارغة!');
                return;
            }

            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const orderData = {
                customer: { name, phone, address },
                items: cart,
                totalAmount: total,
                status: "جديد",
                createdAt: new Date().toISOString()
            };

            // حفظ الطلب في Firebase Realtime Database
            const newOrderRef = db.ref('orders').push();
            newOrderRef.set(orderData).then(() => {
                // بناء رسالة الواتساب
                let msg = `*طلب جديد من AhmedStor*%0A%0A`;
                msg += `*الاسم:* ${name}%0A`;
                msg += `*الهاتف:* ${phone}%0A`;
                msg += `*العنوان:* ${address}%0A%0A`;
                msg += `*تفاصيل الطلب:*%0A`;

                cart.forEach((item, index) => {
                    msg += `${index + 1}. ${item.title} (الكمية: ${item.qty}) - ${item.price * item.qty} ج.م%0A`;
                });

                msg += `%0A*الإجمالي:* ${total} ج.م`;

                // تفريغ السلة واغلاق النافذة
                cart = [];
                saveCart();
                toggleCartModal();
                document.getElementById('orderForm').reset();

                // توجيه المستخدم لواتساب (ضع رقم هاتفك بدلاً من 201000000000)
                const whatsappPhone = "201000000000"; 
                window.open(`https://wa.me/${whatsappPhone}?text=${msg}`, '_blank');
            }).catch(err => {
                alert('حدث خطأ أثناء حفظ الطلب: ' + err.message);
            });
        }
    </script>
</body>
  </html>
